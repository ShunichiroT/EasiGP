      # torch/torchvision/torchaudio pulled from PyTorch's CUDA 12.1 wheel
      # index rather than plain PyPI. On Windows, plain "pip install torch"
      # silently gives you a CPU-only build even with a GPU present - you
      # have to point at a CUDA index explicitly to get GPU support. This
      # CUDA-enabled build also runs fine with no GPU at all (torch.cuda.
      # is_available() just returns False, no import/runtime errors) - it's
      # a single install that covers both CPU-only and GPU machines. Only
      # requirement on a GPU machine: an NVIDIA driver new enough for CUDA
      # 12.1 (installed on the OS, not something conda/pip manages). If you
      # only ever run on CPU and want a much smaller download, swap this
      # for --extra-index-url https://download.pytorch.org/whl/cpu instead.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - torchaudio==2.5.1
      - torchvision==0.20.1
      # torch-{scatter,sparse,cluster,spline-conv} wheels only exist on PyG's
      # own wheel index, not PyPI - a plain "pip install x==..." can't find
      # them without this. Pointed at the cu121 build to match the CUDA
      # torch above (a "cpu" tagged extension wheel won't load correctly
      # against a CUDA-enabled torch). These wheels also work fine on
      # CPU-only machines, same as torch itself above.
      - --find-links https://data.pyg.org/whl/torch-2.5.1+cu121.html
      - torch-cluster==1.6.3
      # Bumped down to 2.6.0 to match Linux exactly (Linux pins 2.6.0; this
      # file previously had 2.6.1).
      - torch-geometric==2.6.0
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - torch-spline-conv==1.2.2
      - yarl==1.20.1
      # xgboost / interpret - Tier 2 OPTIONAL models (models/XGBoost.py,
      # models/EBM.py), added here to match the Linux env. Both are pure
      # cross-platform Python packages with native Windows wheels, so -
      # unlike cuML - there's no platform reason to leave them out here.
      # xgboost==3.4.* does not exist on PyPI (3.2.0 is the newest release
      # as of this writing) - pinned to 3.2.* to match Linux exactly.
      - xgboost==3.2.*
      - interpret==0.7.*

# ---------------------------------------------------------------------------
# Package-version parity with the Linux env (environment_linux.yml):
#
# All Python packages shared between the two files - across both conda and
# pip sections - are now pinned to the same version, with two deliberate
# categories of exception:
#
# 1. cuML (cuml-cu12) - Linux/WSL2 only, no Windows build exists. See the
#    NOTE at the top of this file.
# 2. Low-level platform/toolchain packages that are not directly imported
#    by this project's code and are inherently OS-specific builds - the
#    Python interpreter itself (python=3.11.13 here vs 3.11.11 on Linux),
#    system/compression/font/graphics C libraries (openssl, sqlite, tk,
#    cairo, libxml2, libcurl, libtiff, libdeflate, expat, c-ares,
#    ca-certificates, pixman, lerc, libbrotli*, etc.), and the entire
#    r-* package set (this file's R build is r-base=4.1.3 vs Linux's
#    r-base=4.3.1 - realigning individual r-* versions without also
#    re-basing R itself would very likely produce an unsolvable or
#    inconsistent R environment, so R was intentionally left as-is).
#    Forcing exact cross-platform version/build matches on these would
#    risk an unsolvable conda environment (a pinned build string that
#    simply doesn't exist for win-64), which is the opposite of the
#    "no compatibility errors" goal here. If true parity on any of these
#    is required, it should be done by re-solving the env on Windows
#    (e.g. `conda env create` with the versions relaxed to `pkg=X.Y.Z`,
#    no build string) rather than hand-editing build hashes.
# ---------------------------------------------------------------------------
