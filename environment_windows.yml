# NOTE on cuML / GPU scikit-learn:
# cuML (NVIDIA RAPIDS) does not support native Windows at all - only Linux
# and WSL2 (see https://docs.rapids.ai/install/). There is no Windows wheel
# or conda package to add here, so this file intentionally does NOT include
# it. The "falling back to scikit-learn's CPU RandomForestRegressor" message
# on native Windows is expected behavior, not a misconfiguration.
# To actually get GPU-accelerated cuML on a Windows machine, run under WSL2
# and use the companion Linux environment.yml (which does include cuml-cu12)
# inside that WSL2 Ubuntu instance instead of this file.
