  - pip:
      # aiohappyeyeballs..itsdangerous..watchdog block below were previously
      # installed via conda (anaconda/conda-forge builds), each at a
      # different version than the Linux env. Moved to pip and pinned to
      # the exact same versions Linux already installs via pip, both to
      # equalize the two platforms and to avoid a mixed conda+pip spec for
      # the same package (a common source of "compatible on paper, breaks
      # at import" errors). Native-library-backed conda siblings that
      # aren't themselves imported by user code (libprotobuf, and arrow-cpp
      # which is now unused and removed) were left alone/removed rather
      # than version-bumped, since pip's pyarrow/protobuf wheels bundle
      # their own compiled runtime and don't need those to match.
      - aiohappyeyeballs==2.6.1
